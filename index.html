<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>قرآن کریم | ترجمہ اور تفسیر</title>

    <meta name="description"
        content="قرآن کریم، اردو ترجمہ اور تفسیر">

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="container">

            <h1>القرآن الكريم</h1>

            <p>
                قرآن کریم • اردو ترجمہ • تفسیر
            </p>

        </div>

    </header>


    <!-- Navigation / Controls -->
    <section class="controls">

        <div class="container">

            <div class="controls-box">

                <label for="surahSelect">
                    سورت منتخب کریں
                </label>

                <select id="surahSelect">
                    <option value="">
                        سورت منتخب کریں
                    </option>
                </select>


                <label for="searchInput">
                    تلاش
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="آیت یا ترجمہ تلاش کریں..."
                >


                <button id="themeButton">
                    🌙 ڈارک موڈ
                </button>

            </div>

        </div>

    </section>


    <!-- Main Quran Area -->
    <main>

        <div class="container">

            <div id="ayahContainer">

                <!-- Ayat JavaScript کے ذریعے یہاں آئیں گی -->

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            <p>
                © 2026 قرآن کریم — اردو ترجمہ و تفسیر
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="data.js"></script>

    <script src="script.js"></script>

</body>

</html>
